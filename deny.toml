# cargo-deny: licences, advisories, duplicates, sources.
#
# The licence list is a whitelist: anything not named here fails. AGPL is denied
# outright (docs/design.md §2). MPL is not in the whitelist either; the seven MPL
# crates already in the graph are named one by one below, so a new MPL dependency
# fails until someone decides it can meet MPL's file-level obligations.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# Both are quick-xml 0.38.4, pinned by citationberg <- hayagriva <- typst-library:
# XML denial of service. Green hands typst no user-supplied XML, and the fix is a
# typst release that moves hayagriva off citationberg 0.7 — that bump is the
# mainline's call. Review when typst is updated.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quadratic scan of a start tag, inside typst's citationberg; no untrusted XML reaches it" },
    { id = "RUSTSEC-2026-0195", reason = "unbounded namespace declarations, same path; fixed by a typst bump" },
]

[licenses]
# OFL-1.1 is here for the fonts that ship beside the binary, not for a crate:
# cargo-deny will keep reporting it as an unmatched allowance, which is expected.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# No deny list: cargo-deny 0.22 removed `[licenses] deny` in favour of this
# whitelist, so every licence not named above fails. That covers AGPL-3.0-only /
# -or-later by construction, and MPL-2.0 except for the crates named below.
confidence-threshold = 0.93

# Our own crates; green-math is the one without `publish = false`.
[[licenses.exceptions]]
crate = "green-math"
allow = ["GPL-3.0-or-later"]

# MPL-2.0 is GPL-compatible and its obligations are met by shipping the sources,
# which crates.io holds under the same version. Each is named so the pattern does
# not spread: dwrote, option-ext and selectors/cssparser reach the binary; cbindgen
# builds host tools only.
[[licenses.exceptions]]
crate = "cbindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dwrote"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
# Groups at R14.35, all two upstream majors; none may join.
# ely-files 0.1.1 is the component library's own crate.
skip = [

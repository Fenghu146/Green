    "rand",
    "rand_chacha",
    "rand_core",
    "read-fonts",
    "redox_users",
    "r-efi",
    "roxmltree",
    "rustc-hash",
    "security-framework",
    "serde_spanned",
    "sha2",
    "skrifa",
    "spin",
    "strum",
    "strum_macros",
    "syn",
    "synstructure",

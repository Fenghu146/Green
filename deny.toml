    "dirs-sys",
    "ely-files",
    "fancy-regex",
    "fearless_simd",
    "foldhash",
    "font-types",
    "getrandom",
    "hashbrown",
    "hayro-ccitt",
    "heck",
    "inout",
    "jni",
    "jni-sys",
    "md-5",
    "miniz_oxide",
    "nom",
    "objc2",
    "objc2-app-kit",
    "objc2-foundation",
    "object",
    "phf",
    "phf_generator",

name: capture

# Manual, and on main only: this runs to learn whether an offscreen frame comes out the same
# on a runner as on the machine where it was written. It is deliberately not part of the
# pull-request path — a picture that depends on the machine must never gate a change.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build green with the capture feature
        run: cargo build -p green --features capture

      - name: Capture the baseline document
        run: target\debug\green.exe --capture capture.png --theme dark tests\fixtures\capture.md

      - name: Say what came out
        shell: pwsh
        run: |
          $hash = (Get-FileHash capture.png -Algorithm SHA256).Hash
          Write-Output "capture.png sha256: $hash"
          Write-Output "recorded on the development machine: 905A8929ACEC5C282FA4E2FE05E227814B4D85FD4C01A588401270096DCA4476"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "capture.png sha256 ``$hash``"

      - uses: actions/upload-artifact@v4
        with:
          name: capture
          path: capture.png

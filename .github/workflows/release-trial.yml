name: release-trial

# Phase A of the first release: does `green` build at all off Windows?
# Nothing is packaged, uploaded or tagged here; the only output is a verdict
# per platform and, on a red one, the first errors rustc printed.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # A red platform still leaves the next run something to restore.
          cache-on-failure: true

      - run: rustup show active-toolchain
      - name: The machine
        shell: bash
        run: |
          uname -a || true
          rustc -vV
          cargo -V

      # gpui's Linux backend links xkbcommon, fontconfig and wayland; the
      # runner image ships none of the -dev packages.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libwayland-protocols \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: cargo build -p green --release --locked
        shell: bash
        run: |
          set +e
          cargo build -p green --release --locked 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$status" >>"$GITHUB_ENV"
          exit $status

      - name: Verdict
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo
            if [ "${BUILD_EXIT:-missing}" = "0" ]; then
              echo '`cargo build -p green --release --locked`: **success**'
            else
              echo "\`cargo build -p green --release --locked\`: **failure** (exit ${BUILD_EXIT:-missing})"
              echo
              echo '```text'
              # From the first line rustc calls an error, 40 lines: enough for
              # the root cause, never the whole log.
              awk '/^error(\[|:)/{found=1} found{print; n++} n>=40{exit}' build.log 2>/dev/null \
                || tail -40 build.log 2>/dev/null
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

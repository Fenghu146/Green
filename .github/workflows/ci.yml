name: ci

on:
  # Every branch: a feature branch's first push is where a new workflow earns
  # its trust, and main is not the only place a break lands.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Python's UTF-8 mode: a Windows console is cp1252, and this repo prints Chinese.
  PYTHONUTF8: 1
  # Incremental artifacts are the bulk of a debug target and the cache restores
  # whole crates anyway; turning them off buys back gigabytes.
  CARGO_INCREMENTAL: 0

jobs:
  # The runners share the workspace drive with the build; a full disk fails rustc
  # with no useful message. This names the number and the directories first.
  disk:
    name: disk
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The machine's own water level is 30/50 GB; a runner starts with far less
      # disk in absolute terms, so the runner only fails when the checkout cannot build.
      - shell: bash
        run: scripts/disk.sh 4G 8G .

  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the channel and its components; the first
      # cargo call installs them.
      - run: rustup show active-toolchain
      - run: cargo build -p green --locked
      # The real-note fixture job uses this exact binary; no second build.
      - uses: actions/upload-artifact@v4
        with:
          name: green-for-fixtures
          path: target/debug/green.exe
          retention-days: 1

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # A red run still leaves the next one a cache to restore.
          cache-on-failure: true
      - run: rustup show active-toolchain
      # ely-lok as its own package: under the workspace's unified features three
      # view::reveal tests need a LOK kernel and panic without ELY_LOK_DIR.
      - run: cargo test -p ely-lok --locked
      # ely-pdf-worker's build script refuses to run without libmupdf.lib, which
      # scripts/build-mupdf.sh produces; no runner has that build, and no other
      # package depends on it, so it is excluded rather than skipped silently.
      #
      # green-math's real-Typst test and green-export's end-to-end test are the
      # only gates against converter output Typst rejects. Pin the CLI: a
      # self-updating test dependency would move the gate with time.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/typst-cache
          key: typst-0.15.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Typst 0.15.1
        shell: bash
        env:
          TYPST_VERSION: 0.15.1
          TYPST_ASSET: typst-x86_64-pc-windows-msvc.zip
          TYPST_CACHE: ${{ runner.temp }}/typst-cache
          TYPST_DEST: ${{ runner.temp }}/typst-unpack
        run: |
          set -euo pipefail
          cache=$(cygpath -u "$TYPST_CACHE")
          dest=$(cygpath -u "$TYPST_DEST")
          mkdir -p "$cache"
          zip="$cache/$TYPST_ASSET"
          if [ ! -f "$zip" ]; then
            curl -fL --retry 3 --connect-timeout 15 \
              "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${TYPST_ASSET}" \
              -o "$zip"
          fi
          rm -rf "$dest"
          mkdir -p "$dest"
          unzip -q "$zip" -d "$dest"
          exe=$(find "$dest" -type f -name 'typst.exe' -print -quit)
          [ -n "$exe" ] || { echo "typst: no typst.exe in $TYPST_ASSET" >&2; exit 1; }
          version=$("$exe" --version)
          case $version in
            *"$TYPST_VERSION"*) ;;
            *) echo "typst: expected $TYPST_VERSION, got $version" >&2; exit 1 ;;
          esac
          echo "GREEN_TYPST=$(cygpath -w "$exe")" >>"$GITHUB_ENV"
          echo "typst: $version" >>"$GITHUB_STEP_SUMMARY"
      - shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude ely-pdf-worker --exclude ely-lok --exclude green --locked 2>&1 | tee tests.log
      # A skip nobody sees is a test that does not exist; this writes every one
      # of them to the job summary, and fails on one skipped for a missing tool.
      - if: always()
        shell: bash
        run: scripts/skips.sh tests.log
      # The gate is the exit code: a log with only #[ignore]d tests must be
      # green, a SKIP: line must be red. Re-run both cases on every build so
      # that contract stays explicit. Run 45808353158 was red for a different
      # reason: cargo test exited 101 on the Node plugin test (process.rs:154);
      # this step succeeded. See STATUS.md.
      - name: skips.sh self-test
        shell: bash
        run: scripts/skips-self-test.sh
      # The fixture job runs separately so this job stays under the time
      # budget; it reuses this Typst and the green.exe built by the build job.
      - uses: actions/upload-artifact@v4
        with:
          name: typst-for-fixtures
          path: ${{ env.GREEN_TYPST }}
          retention-days: 1

  test-app:
    name: test green
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup show active-toolchain
      # This job runs the app's own tests and the skips gate. It stays enabled
      # on purpose: disabling it is how a real breakage would go unnoticed.
      - shell: bash
        run: |
          set -o pipefail
          cargo test -p green --locked 2>&1 | tee tests.log
      - if: always()
        shell: bash
        run: scripts/skips.sh tests.log

  # Real notes, but only the ones that pass: ci-positive.txt is the whitelist.
  # This waits for the build and test jobs, then reuses their green.exe and
  # Typst; a cold path stays inside the three-minute job budget.
  real-fixtures:
    name: real note fixtures
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: green-for-fixtures
          path: ${{ runner.temp }}/fixture-bin
      - uses: actions/download-artifact@v4
        with:
          name: typst-for-fixtures
          path: ${{ runner.temp }}/fixture-typst
      - name: Export and audit the passing skeletons
        shell: bash
        env:
          GREEN_TYPST: ${{ runner.temp }}/fixture-typst/typst.exe
          FIXTURE_GREEN: ${{ runner.temp }}/fixture-bin/green.exe
          REAL_FIXTURE_WORK: ${{ runner.temp }}/real-fixtures
        run: |
          set -euo pipefail
          python tools/check_real_fixtures.py --green "$FIXTURE_GREEN" --out "$REAL_FIXTURE_WORK"

  lint:
    name: lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup show active-toolchain
      # Warnings do not fail the job. One is open and ours: clippy::type_complexity
      # in green-math's `cached` (the SEEN OnceLock type). `vendor/` is upstream
      # code with its own lints, so its warnings are counted apart and never gate
      # us. When our count reaches zero, the gate is `test ! -s ours.log`.
      - shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude ely-pdf-worker --no-deps --lib --bins --locked \
            --message-format short -- -W clippy::all 2>&1 | tee clippy.log
          grep ': warning: ' clippy.log | grep -v '^vendor' >ours.log || true
          grep ': warning: ' clippy.log | grep '^vendor' >vendored.log || true
          ours=$(grep -c . ours.log || true)
          vendored=$(grep -c . vendored.log || true)
          echo "clippy: $ours in our crates, $vendored in vendored code (not our lint)" >>"$GITHUB_STEP_SUMMARY"
          cat ours.log >>"$GITHUB_STEP_SUMMARY" || true

  # The release benchmark, off the PR path on purpose: its numbers move with
  # whatever else the machine is doing, and a gate that reddens under load
  # teaches people to ignore red. Design §5.4: CI runs the release benchmark
  # alone, and one at a time: gpui's shape counter is per process, so benches
  # running in parallel count each other's shaping. The debug run prints and
  # never gates, and both benchmarks are #[ignore]d, so the ordinary test jobs
  # see them as ignored, not failed.
  bench:
    name: bench (release)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustup show active-toolchain
      - shell: bash
        run: |
          set -o pipefail
          cargo test --release -p green --features shape-count --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee bench.log
      # The number and the machine that took it, together: the tests print both.
      - if: always()
        shell: bash
        run: |
          grep -E '^(folding|outline):' bench.log >>"$GITHUB_STEP_SUMMARY" || true
          scripts/skips.sh bench.log

  tools:
    name: tools
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show active-toolchain
      # Formatting is gated here and only here: tools/ is rustfmt-clean, while the
      # product tree is not — 678 files differ at the pinned 1.9.0 with the 2024
      # style edition — so a workspace-wide gate would be red for reasons that are
      # not this workflow's to fix. Add `cargo fmt --all --check` in the commit
      # that formats apps/ and crates/.
      - run: cargo fmt --manifest-path tools/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/Cargo.toml --locked
      # The committed fixtures must be exactly what the generator writes.
      - run: cargo run --manifest-path tools/Cargo.toml --bin fixtures --locked -- --check
      # disk-prune's root and its top-level-profile rule need no build input.
      - run: bash tests/scripts/disk-prune-rules.sh

  licenses:
    name: licenses
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1
      # Whitelist in deny.toml: AGPL fails by omission, MPL only for the crates
      # named there. `-D unnecessary-skip` keeps the bans skip list honest.
      - run: cargo deny check -D unnecessary-skip -D unmatched-skip

  # vendor/ is a build input: these replay the patch series against the pinned
  # upstreams and compare the result with what is committed, file by file.
  vendor:
    name: vendor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: scripts/vendor-gpui.sh check
      - shell: bash
        run: scripts/vendor-components.sh check
      - shell: bash
        run: scripts/vendor-crates.sh check
      # docs/compatibility.md names the pins and the patch counts; this says it
      # still does.
      - shell: bash
        run: python scripts/compatibility.py --check

  notices:
    name: notices
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.2
      - run: rustup show active-toolchain
      - shell: bash
        run: scripts/notices.sh
      # THIRD-PARTY-NOTICES.txt is generated; a dependency change that skips it
      # would ship notices that no longer match Cargo.lock.
      - shell: bash
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt
